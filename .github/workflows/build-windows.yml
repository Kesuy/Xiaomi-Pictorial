name: Build Windows EXE

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile check
        run: python -m py_compile xiaomi_pictorial.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate high-resolution app icons
        run: python tools/generate_icon.py

      - name: Build EXE
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Xiaomi-Pictorial
          --icon assets/app_icon.ico
          --add-data "assets/app_icon.png;assets"
          --add-data "assets/app_icon.ico;assets"
          xiaomi_pictorial.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Pictorial-Windows
          path: dist/Xiaomi-Pictorial.exe
          if-no-files-found: error


  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Xiaomi-Pictorial-Windows
          path: release

      - name: Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v0.2.1"
          $title = "Xiaomi Pictorial v0.2.1"
          $notes = @"
          v0.2.1 修复与体验改进。

          - 修复 EXE / 标题栏图标显示与清晰度
          - 使用 1024×1024 源图生成多尺寸 Windows ICO
          - xiaomi-pictorial.json 持久化保存路径、日期、图片质量、命名格式及所有开关
          - 启动时自动恢复上次配置和窗口大小
          - 保留 device_id 配置
          - 继续保留早安画报历史批量下载、断点跳过与失败重试
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag release/Xiaomi-Pictorial.exe --target "${{ github.sha }}" --title $title --notes $notes --latest
          } else {
            gh release upload $tag release/Xiaomi-Pictorial.exe --clobber
          }
